<html>
    <head>
        <title>Evaluation</title>
    </head>
    <body>
        <p>Click on the button to evaluate Js expression</p>
        <button onclick="ev()">Try it</button>
        <P id="result"></P>
        <script>
            function ev(){
                var x= 9
                var y = 5

                var a=eval("x+y")+" <br>"
                var b=eval("5*9")+" <br>"
                var c=eval("y-x")+" <br>"
                var res=a+b+c
                document.getElementById("result").innerHTML=res
            }
        </script>
    </body>
</html>
