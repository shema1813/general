<!DOCTYPE html>
<html>
<head>
    <title>Random Numbers</title>
</head>
<body>

    <h2>Random Numbers</h2>
    <button onclick="randomNums()">Generate</button>
    <p id="r"></p>

    <script>
        function randomNums() {
            let text = "";
            let i = 0;

            while (i < 10) {   
                let rand = Math.floor(Math.random() * 100); 
                text += "Random number: " + rand + "<br>";
                i++;
            }

            document.getElementById("r").innerHTML = text;
        }
    </script>

</body>
</html>
