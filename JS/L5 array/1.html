<html>
    <head>
        <title>Arrary</title>
    </head>
    <body>
        <h1>Js Arrary</h1>
        <script>
            var fruits = ["grapes","apples","mango","passion"]
            document.write(fruits[2] + "<br>")
            document.write("using join operator: <br>"+fruits.join(" $* ") + "<br>")
            document.write(fruits + "<br>")
            fruits.pop()
            document.write(fruits +"<br>")
            fruits.push("Banana")
            document.write("after push <br>"+fruits +"<br>")
            fruits.unshift("Orange")
            document.write("after unshift <br>"+fruits +"<br>")
            fruits.sort()
            document.write("after sort <br>"+fruits +"<br>")
            fruits.reverse()
            document.write("after reverse <br>"+fruits +"<br>")
        </script>
    </body>
</html>
