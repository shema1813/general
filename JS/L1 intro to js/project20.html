<html>
    <head>
        <title>Intro to JS</title>
    </head>

    <body>
        <h1 id="m"></h1>
        <p id="p"></p>

        <h1>JS variables</h1>
        <p id="result"></p>
        <p id="result1"></p>
        <p id="result2"></p>
        <p id="result3"></p>
        <p id="result4"></p>

        <script>
            document.getElementById('m').innerHTML="JS comment in head"
             document.getElementById('p').innerHTML="JS comment in paragraph"

             var num1 = 5 //statement
             var num2 = 7 //statement

             var sum=num1+num2 //statement
             document.getElementById('result').innerHTML="The total sum is: "+sum

              var sub=num1-num2 //statement
             document.getElementById('result1').innerHTML="The total sub is: "+sub

              var multi=num1*num2 //statement
             document.getElementById('result2').innerHTML="The total multi is: "+multi

              var div=num1/num2 //statement
             document.getElementById('result3').innerHTML="The total div is: "+div

              var all=num1+num2/num2*num1-num2 //statement
             document.getElementById('result4').innerHTML="The total all is: "+all

             
             </script>
    </body>
</html>
