<!DOCTYPE html>
<html>
    <head>
        <title></title>
    </head>
    <body>
        <h1>Real time validation</h1>
        <hr>

        <div class="box">
            <form id="loginForm">
                <div class="row">
                    <label>Email:</label>
                    <input type="text" id="Email" placeholder="myname@gmail.com">
                </div>

                  <div class="row">
                    <label>Pssword:</label>
                    <input type="password" id="password" placeholder="__________">
                </div>

                  <div class="row">
                    <label>Age:</label>
                    <input type="number" id="Age" >
                </div>

                <button type="submit">Login</button>
            </form>
        </div>
        <p id="message"></p>

        <script src="form validation.js"></script>

        
    </body>
</html>
