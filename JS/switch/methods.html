<html>
    <head>
        <title>Document</title>
    </head>
    <body>
        <h1>Basic methods</h1>
        <script>
            var str = "Amazing"
            document.write(str.toLocaleLowerCase() + "<br>")
            document.write(str.toLocaleUpperCase() + "<br>")
            document.write(str.startsWith("i") + "<br>")
            document.write(Math.random() + "<br>")
            document.write(Math.floor(8.9) + "<br>")

            //loops
            var fruits=['apple' , 'Grapes' , 'mango' , 'grapes']
            var txt=""
            var i
            for(i=1;i<fruits.length;i++){
                txt+=fruits[i]+"<br>"
            }
            document.write(txt + "<br>")
        </script>
    </body>
</html>
