<html>
    <head>
        <title>positioning</title>
        <style>
         .sticky{
            position: sticky;
            top: 30px;
            width: 150px;
            border: 3px solid lime;
         }

          .rel{
            position: relative;
            left: 100px;
            border: 3px solid red;
         }
         
          .abs{
            position: absolute;
            left: 50px;
            border: 3px solid violet;
         }

          .fix{
            position: fixed;
            top: 0;
            left: 150px;
            border: 3px solid blue;
         }

         h2{
            opacity: 1;
         }

         h2{
            opacity: 0.5;
         }

         h2{
            opacity: 0;
         }
        </style>
    </head>

    <body>
    <h1>postioning</h1>
    <div>Div with normal(static) position</div>
    <div class="sticky">Div with sticky positioning</div>
    <div class="rel">Div with normal relative positioning
        <div class="abs">Div with absolute positioning</div>
    </div>
    <h2>opacity</h2>
    <h3>opacity</h3>
    <h4>opacity</h4>
    <div class="fix">Div with fixed positioning</div>

    </body>
    
    
</html>
