<html>
<head>

<!-- Bootstrap CSS -->
<link rel="stylesheet"
href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" />

<!-- Font Awesome -->
<script src="https://kit.fontawesome.com/996973c893.js"></script>

<!-- Google Font -->
<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
rel="stylesheet" />

<title>BlueShark Co.</title>

<style>
body{
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(180deg, #c9f2ff, #7fd8ff, #38b6ff);
    min-height: 100vh;
}


.navigation{
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.3);
    padding: 15px 0;
}

.brand-name{
    font-weight: 700;
    letter-spacing: 2px;
    font-size: 22px;
    color: #003f5c;
}

.navigation-link{
    color: #003f5c;
    font-weight: 500;
    text-decoration: none;
    transition: 0.3s ease;
    position: relative;
}

/* Underline hover animation */
.navigation-link::after{
    content: "";
    position: absolute;
    width: 0%;
    height: 2px;
    left: 0;
    bottom: -5px;
    background: #0077b6;
    transition: 0.4s;
}

.navigation-link:hover{
    color: #0077b6;
}

.navigation-link:hover::after{
    width: 100%;
}

</style>
</head>

<body>

<!-- Navbar -->
<div class="container-fluid navigation">
    <div class="row align-items-center">

        <!-- Logo -->
        <div class="col-6 d-flex align-items-center pl-4">
            <i class="fas fa-water fa-2x shark-icon"></i>
            <span class="brand-name pl-2">BlueShark Co.</span>
        </div>

        <!-- Menu -->
        <div class="col-6">
            <div class="row justify-content-end text-center">
                <div class="col-3">
                    <a href="#" class="navigation-link">Home</a>
                </div>
                <div class="col-3">
                    <a href="#" class="navigation-link">About</a>
                </div>
                <div class="col-3">
                    <a href="#" class="navigation-link">Services</a>
                </div>
                <div class="col-3">
                    <a href="#" class="navigation-link">Contact</a>
                </div>
            </div>
        </div>

    </div>
</div>
</body>
</html>
