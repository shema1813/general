<html>
<head>
    <title>Bank App</title>

    <style>
    body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #1e3c72, #2a5298);
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 400px;
            margin: 50px auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
        }

        h2 {
            text-align: center;
            color: #2a5298;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            font-size: 12px;
            color: #777;
            margin-bottom: 15px;
        }

        .balance {
            background: #2a5298;
            color: white;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        label {
            font-weight: bold;
            font-size: 14px;
        }

        select, input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            transition: 0.2s;
        }

        select:focus, input:focus {
            border-color: #2a5298;
            box-shadow: 0 0 5px rgba(42,82,152,0.3);
            outline: none;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        button {
            width: 48%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .income {
            background: #28a745;
            color: white;
        }

        .income:hover {
            background: #218838;
        }

        .expense {
            background: #dc3545;
            color: white;
        }

        .expense:hover {
            background: #c82333;
        }

        h3 {
            margin-top: 10px;
            margin-bottom: 10px;
            border-bottom: 2px solid #eee;
            padding-bottom: 5px;
        }

        ul {
            list-style: none;
            padding: 0;
            max-height: 150px;
            overflow-y: auto;
        }

        li {
            background: #f9f9f9;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }

        .income-item {
            border-left: 5px solid #28a745;
        }

        .expense-item {
            border-left: 5px solid #dc3545;
        }

        
        .footer {
            text-align: center;
            font-size: 11px;
            color: #aaa;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<h2>My Bank Tracker</h2>

<h3>Balance: KES 0</h3>

<label>Choose transaction:</label><br>
<select id="transaction">
    <option value="Salary">Salary</option>
    <option value="Business">Business</option>
    <option value="Gift">Gift</option>
    <option value="Food">Food</option>
    <option value="Transport">Transport</option>
    <option value="Rent">Rent</option>
    <option value="Airtime">Airtime</option>
</select><br><br>

<input type="number" placeholder="Amount"><br><br>

<button>Add Income</button>
<button>Add Expense</button>

<h3>Transactions</h3>
<ul>
   
</ul>

</body>
</html>
