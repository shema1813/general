<html>
<head>
    <title>Bank App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #1e3c72, #2a5298);
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 400px;
            margin: 50px auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
        }

        h2 {
            text-align: center;
            color: #2a5298;
        }

        .balance {
            background: #2a5298;
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 20px;
            margin-bottom: 15px;
        }

        select, input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
        }

        button {
            width: 48%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            font-weight: bold;
        }

        .income {
            background: #28a745;
        }

        .expense {
            background: #dc3545;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: #f1f1f1;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>My Bank Tracker</h2>

    <div class="balance">
        Balance: KES <span id="balance">0</span>
    </div>

    <label>Description:</label>
    <input type="text" id="desc" placeholder="e.g. Salary, Food">

    <label>Choose transaction:</label>
    <select id="transaction">
        <option value="Salary">Salary</option>
        <option value="Business">Business</option>
        <option value="Gift">Gift</option>
        <option value="Food">Food</option>
        <option value="Transport">Transport</option>
        <option value="Rent">Rent</option>
        <option value="Airtime">Airtime</option>
    </select>

    <input type="number" id="amount" placeholder="Amount">

    <div class="buttons">
        <button class="income" onclick="addIncome()">Add Income</button>
        <button class="expense" onclick="addExpense()">Add Expense</button>
    </div>

    <h3>Transactions</h3>
    <ul id="list"></ul>
</div>

<script>
    let balance = 0;

    function addTransaction(type) {
        const descInput = document.getElementById("desc");
        const amountInput = document.getElementById("amount");
        const select = document.getElementById("transaction");

        let desc = descInput.value || select.value;
        let amount = Number(amountInput.value);

        if (!amount || amount <= 0) {
            alert("Enter a valid amount");
            return;
        }

        const list = document.getElementById("list");
        const item = document.createElement("li");

        if (type === "income") {
            balance += amount;
            item.textContent = desc + " +KES " + amount;
        } else {
            balance -= amount;
            item.textContent = desc + " -KES " + amount;
        }

        list.appendChild(item);
        document.getElementById("balance").textContent = balance;

        
        amountInput.value = "";
        descInput.value = "";
    }

    function addIncome() {
        addTransaction("income");
    }

    function addExpense() {
        addTransaction("expense");
    }
</script>

</body>
</html>
