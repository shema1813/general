<html>
    <head>
        <title>Shark World</title>
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
    </head>
    <body>

       
        <div class="container-fluid mb-5">
            <div class="row">

                <div class="col-6">
                    <div class="jumbotron text-center bg-dark text-white h-100">
                        <h1 class="display-4 text-info">Shark World</h1>
                        <p>Discover the power, mystery, and beauty of sharks</p>
                    </div>
                </div>

               
                <div class="col-6 text-center">
                    <h1>Shark Types</h1>
                    <button class="btn btn-primary m-1">Great White</button>
                    <button class="btn btn-secondary m-1">Hammerhead</button>
                    <button class="btn btn-info m-1">Blue Shark</button>
                    <button class="btn btn-success m-1">Whale Shark</button>
                    <button class="btn btn-warning m-1">Tiger Shark</button>
                    <button class="btn btn-danger m-1">Bull Shark</button>
                    <button class="btn btn-light m-1">Reef Shark</button>
                    <button class="btn btn-dark m-1">Mako Shark</button>
                </div>

            </div>
        </div>

      
        <div class="container text-center mb-5">
            <h1 class="mb-3">Shark Facts</h1>
            <span class="badge badge-primary m-1">Carnivores</span>
            <span class="badge badge-secondary m-1">Fast Swimmers</span>
            <span class="badge badge-info m-1">Ocean Predators</span>
            <span class="badge badge-success m-1">Ancient Species</span>
            <span class="badge badge-warning m-1">Endangered</span>
            <span class="badge badge-danger m-1">Apex Predators</span>
            <span class="badge badge-light m-1">Cartilage</span>
            <span class="badge badge-dark m-1">Cold-blooded</span>
        </div>

        
        <div class="container mb-5">
            <h1 class="text-center mb-3">Shark Conservation Progress</h1>
            <div class="progress">
                <div class="progress-bar progress-bar-striped progress-bar-animated bg-primary"
                     style="width: 70%;">
                    70%
                </div>
            </div>
        </div>

    </body>
</html>
